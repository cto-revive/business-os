name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres_test
          POSTGRES_DB: business_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d business_os_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://business_os_app:business_os_test@127.0.0.1:5432/business_os_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate configuration
        run: pnpm validate:config
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Architecture checks
        run: pnpm architecture:check
      - name: Prepare PostgreSQL runtime role
        env:
          PGURL: postgresql://postgres:postgres_test@127.0.0.1:5432/business_os_test
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "CREATE ROLE business_os_app LOGIN PASSWORD 'business_os_test';"
      - name: Run G-003 migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres_test@127.0.0.1:5432/business_os_test
        run: pnpm db:migrate
      - name: Grant G-003 runtime privileges
        env:
          PGURL: postgresql://postgres:postgres_test@127.0.0.1:5432/business_os_test
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO business_os_app" -c "GRANT SELECT, INSERT ON TABLE public.audit_events TO business_os_app"
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
